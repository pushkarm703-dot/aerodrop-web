<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerodrop | Secure Local Sync</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#050B18',
                        primary: '#00F2FF',
                        secondary: '#FFD600' /* CHANGED: Purple to Bright Yellow */
                    },
                    fontFamily: {
                        mono: ['Courier New', 'monospace'],
                        sans: ['system-ui', '-apple-system', 'sans-serif']
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
                            '50%': { opacity: '0.8', transform: 'scale(1.05)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #050B18; color: white; overflow-x: hidden; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glow-text { text-shadow: 0 0 20px rgba(0, 242, 255, 0.6); }
        .download-card:hover { border-color: #00F2FF; box-shadow: 0 0 30px rgba(0, 242, 255, 0.15); }
        
        /* THE FULL-WIDTH 3D INTERACTIVE SHOWCASE */
        main.hero-container {
            perspective: 2000px; 
            overflow: hidden; 
            width: 100%;
        }

        /* DEFAULT DESKTOP BEHAVIOR */
        .showcase-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            animation: float-3d-ambient 12s ease-in-out infinite;
            z-index: 1; 
        }

        .showcase-img {
            position: absolute;
            border-radius: 16px;
            border: 1px solid rgba(0, 242, 255, 0.15);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 255, 0.05);
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
            transform-style: preserve-3d;
            
            opacity: 0.7; 
            filter: blur(2px) brightness(0.8); 
        }

        .img-left { 
            width: 250px;
            transform: translateX(-400px) translateZ(-200px) rotateY(40deg); 
        }
        .img-center { 
            width: 320px;
            transform: translateX(0px) translateZ(-50px); 
            z-index: 2; 
            opacity: 0.25; 
            filter: blur(3px) brightness(0.4); 
        }
        .img-right { 
            width: 250px;
            transform: translateX(400px) translateZ(-200px) rotateY(-40deg); 
        }
        
        /* Desktop Hover Interactions */
        @media (min-width: 769px) {
            .interactive-perspective {
                transition: transform 0.1s ease-out; 
            }
            .showcase-img:hover {
                opacity: 0.95 !important;
                filter: blur(0px) brightness(1.15) !important;
                transform: translateX(0px) translateZ(200px) rotateY(0deg) scale(1.3) !important;
                z-index: 50 !important; 
                border-color: #00F2FF !important;
                box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9), 0 0 80px rgba(0, 242, 255, 0.6) !important;
            }
        }

        /* MOBILE RESPONSIVE FIXES */
        @media (max-width: 768px) {
            main.hero-container {
                padding-top: 7rem;
                min-height: 100vh;
            }
            .showcase-wrapper {
                position: absolute;
                top: 0; bottom: 0; left: 0; right: 0;
                height: 100%;
                z-index: 0; /* Safely behind text */
                animation: float-3d-ambient 8s ease-in-out infinite; 
            }
            .showcase-img {
                pointer-events: none; /* Disables glitchy touch hovering on mobile */
            }
            /* Scaled down and positioned perfectly for mobile backgrounds */
            .img-left { 
                width: 140px;
                transform: translateX(-120px) translateZ(-200px) rotateY(35deg); 
                opacity: 0.3;
            }
            .img-center { 
                width: 220px;
                transform: translateX(0px) translateZ(-100px); 
                opacity: 0.15; /* Highly transparent so text is perfectly readable */
                filter: blur(2px) brightness(0.4);
                z-index: 5;
            }
            .img-right { 
                width: 140px;
                transform: translateX(120px) translateZ(-200px) rotateY(-35deg); 
                opacity: 0.3;
            }
            h1.text-5xl {
                font-size: 3.2rem;
                line-height: 1.1;
            }
        }

        @keyframes float-3d-ambient {
            0%, 100% { transform: translateY(0) rotateX(1deg); }
            50% { transform: translateY(-20px) rotateX(-1deg); }
        }

        .showcase-fade {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 200px;
            background: linear-gradient(to bottom, transparent, #050B18);
            z-index: 20;
            pointer-events: none;
        }
    </style>
</head>
